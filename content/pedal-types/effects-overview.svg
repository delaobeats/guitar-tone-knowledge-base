<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="330" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc">
<title id="title">Five families of guitar effects pedals</title>
<desc id="desc">A horizontal flow of five labeled pedal illustrations: Overdrive and Distortion, Fuzz and Boost, Modulation, Delay and Reverb, and Compression and EQ.</desc>
